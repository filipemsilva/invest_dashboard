# nginx-invest-tracker.conf
#
# Nginx configuration for InvestTracker — Portfolio Dashboard
#
# Setup:
#   1. Build the frontend:  npm run build
#   2. Copy dist/ to the path set in `root` below (or adjust the path)
#   3. Start the Node proxy: node proxy-server.js   (or via pm2 / systemd)
#   4. Copy or symlink this file to /etc/nginx/sites-available/invest-tracker
#   5. Enable: ln -s /etc/nginx/sites-available/invest-tracker /etc/nginx/sites-enabled/
#   6. Test:   nginx -t
#   7. Reload: systemctl reload nginx
#
# The Node proxy (proxy-server.js) must be running on 127.0.0.1:3001.
# To keep it alive across reboots, use pm2:
#   pm2 start proxy-server.js --name invest-proxy
#   pm2 save && pm2 startup

server {
    listen 80;
    # Replace with your actual domain or IP. Use '_' to match any.
    server_name invest.example.com;

    # ── Static files (Vite build output) ──────────────────────────────────────
    root /var/www/invest-dashboard/dist;
    index index.html;

    # ── API proxy → Node.js backend (proxy-server.js on :3001) ────────────────
    # Note the generous timeouts: a batch of 68 tickers with server-side chunking
    # can take up to ~15 s; 90 s gives plenty of headroom.
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /health {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
    }

    # ── React SPA (client-side routing) ───────────────────────────────────────
    # try_files: serve the exact file if it exists, otherwise fall back to
    # index.html so React Router can handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Cache static assets aggressively ──────────────────────────────────────
    # Vite fingerprints assets (e.g. index-RU9dWvuo.js), so 1-year cache is safe.
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── PWA Service Worker — must NOT be cached ────────────────────────────────
    location ~* (?:sw\.js|workbox-[^.]+\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── Access logs (optional, adjust path as needed) ─────────────────────────
    # access_log /var/log/nginx/invest-tracker-access.log;
    # error_log  /var/log/nginx/invest-tracker-error.log;
}

